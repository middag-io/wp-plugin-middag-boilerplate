name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP (composer check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: pcov

      # Resolves middag-io/framework + wordpress from the PUBLIC Packagist —
      # no MIDDAG credential, proving the boilerplate is externally installable.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: OSS boundary — TIER A purity
        run: |
          if grep -rnE 'Middag\\(Core|Licensing)\\' src/; then
            echo "::error::TIER A violation — src/ imports a proprietary namespace"; exit 1
          fi
          if grep -qE '"middag-io/(core|licensing)"' composer.json; then
            echo "::error::TIER A violation — composer.json requires a proprietary package"; exit 1
          fi

      - name: Quality gate (cs-fixer + rector + phpstan)
        run: composer check

      # --coverage-text prints the coverage summary in the CI log (visible, not
      # gated). pcov (set above) is the fast coverage driver.
      - name: Tests (Unit + Integration) + coverage report
        run: composer test -- --coverage-text

  ui:
    name: UI (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build:wp
